---
layout: default
---
<!-- Standalone Markdown pages (privacy): same title and body styles as posts, without date or tags -->
<article class="post">
    <header class="post-header">
        <h1 class="post-title">{{ page.title | escape }}</h1>
    </header>

    <div class="post-content">
        {{ content }}
    </div>
</article>
