name: Link Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday

jobs:
  link-check:
    # Pinned: ubuntu-latest (26.04) has no Ruby 3.1 build
    runs-on: ubuntu-24.04
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true

    - name: Build Jekyll site
      run: bundle exec jekyll build

    # A new post's own URL 404s until it deploys. Main and weekly runs still check humaine.studio links.
    # Added to lychee.toml, not passed as --exclude: a CLI --exclude replaces the config's list.
    - name: Skip humaine.studio links on PRs
      if: github.event_name == 'pull_request'
      run: sed -i "s|^exclude = \[|exclude = [\n    '^https://humaine[.]studio/',|" lychee.toml

    - name: Link Checker
      uses: lycheeverse/lychee-action@v1.10.0
      with:
        args: --verbose --no-progress '_site/**/*.html'
        format: markdown
        fail: true
        jobSummary: true
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}