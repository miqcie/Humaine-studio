<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- SEO plugin handles title, description, and social meta tags -->
{% seo %}

<meta name="author" content="{{ site.author.name }}">
<meta name="keywords" content="{% if page.tags %}{{ page.tags | join: ', ' }}{% else %}AI research, human-machine collaboration, artificial intelligence, applied AI{% endif %}">

<!-- Theme before first paint, so dark-mode visitors never see a light flash (main.js keeps it in sync later) -->
<script>try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>

<!-- Favicon (the curlew, built by design-system/build_brand.py) -->
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

<!-- Feed -->
{% feed_meta %}

<!-- Fonts: self-hosted, brand axes baked in (Fraunces SOFT 100, Recursive MONO 1 / CASL 0.5) -->
<link rel="preload" href="{{ '/assets/fonts/fraunces-soft.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/schibsted-grotesk.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

<!-- CSS: design-system tokens and components (generated), then site styles -->
<link rel="stylesheet" href="{{ '/assets/css/humaine-tokens.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/humaine-components.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/humaine-site.css' | relative_url }}">

<!-- Page-specific CSS -->
{% if page.custom_css %}
<style>
{{ page.custom_css }}
</style>
{% endif %}

<!-- Schema.org structured data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{% if page.layout == 'post' %}BlogPosting{% else %}WebSite{% endif %}",
  "name": "{{ site.title }}",
  "description": "{{ site.description }}",
  "url": "{{ site.url }}"{% if page.layout == 'post' %},
  "headline": "{{ page.title }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Person",
    "name": "{{ page.author | default: site.author.name }}"
  }{% endif %},
  "publisher": {
    "@type": "Person",
    "name": "{{ site.author.name }}",
    "email": "{{ site.author.email }}"
  }
}
</script>

<!-- Apollo.io Website Visitor Tracking -->
{% if site.analytics.apollo.app_id %}
<script>
function initApollo() {
  var n = Math.random().toString(36).substring(7),
      o = document.createElement("script");
  o.src = "https://assets.apollo.io/micro/website-tracker/tracker.iife.js?nocache=" + n;
  o.async = true;
  o.defer = true;
  o.onload = function() {
    window.trackingFunctions.onLoad({appId: {{ site.analytics.apollo.app_id | jsonify }}});
  };
  document.head.appendChild(o);
}
initApollo();
</script>
{% endif %}
